name: Security - Container Image Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  container-image-scan:
    name: Build and Scan Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Application Files
        run: |
          echo "Checking repository structure..."

          test -f Dockerfile || {
            echo "ERROR: Dockerfile not found"
            exit 1
          }

          test -f requirements.txt || {
            echo "ERROR: requirements.txt not found"
            exit 1
          }

          test -f app/app.py || {
            echo "ERROR: app/app.py not found"
            exit 1
          }

          echo "Dockerfile found"
          echo "requirements.txt found"
          echo "app/app.py found"

          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f -print

      - name: Build Docker Image
        id: docker-build
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -t local/securitytest:${{ github.sha }} .

      - name: Run Trivy Image Scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/securitytest:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: '1'

      - name: Upload Trivy Report
        if: always() && steps.docker-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-image-report
          path: trivy-results.json
          retention-days: 30

      - name: Create PR Summary
        if: always() && github.event_name == 'pull_request' && steps.docker-build.outcome == 'success'
        shell: bash
        run: |
          python3 <<'PY'
          import json

          report_file = "trivy-results.json"

          with open(report_file) as f:
              data = json.load(f)

          findings = []

          for result in data.get("Results", []):
              target = result.get("Target", "")

              for vuln in result.get("Vulnerabilities", []) or []:
                  severity = vuln.get("Severity", "")

                  if severity not in ("HIGH", "CRITICAL"):
                      continue

                  findings.append({
                      "severity": severity,
                      "id": vuln.get("VulnerabilityID", ""),
                      "package": vuln.get("PkgName", ""),
                      "installed": vuln.get("InstalledVersion", ""),
                      "fixed": vuln.get("FixedVersion", ""),
                      "title": vuln.get("Title", ""),
                      "target": target
                  })

          severity_order = {
              "CRITICAL": 0,
              "HIGH": 1
          }

          findings.sort(
              key=lambda x: severity_order.get(x["severity"], 99)
          )

          total = len(findings)

          with open("comment.md", "w") as f:
              f.write("## Trivy Container Image Security Scan\n\n")

              if total == 0:
                  f.write(
                      "### Result\n\n"
                      "No HIGH or CRITICAL vulnerabilities were found. "
                      ":white_check_mark:\n"
                  )
              else:
                  f.write(
                      "### Result\n\n"
                      f"**{total} HIGH/CRITICAL vulnerabilities detected.** "
                      ":warning:\n\n"
                  )

                  f.write(
                      "| Severity | CVE | Package | Installed | Fixed |\n"
                      "|---|---|---|---|---|\n"
                  )

                  for item in findings[:10]:
                      package = item["package"].replace("|", "\\|")
                      fixed = item["fixed"] or "Not available"

                      f.write(
                          f"| {item['severity']} | "
                          f"`{item['id']}` | "
                          f"`{package}` | "
                          f"`{item['installed']}` | "
                          f"`{fixed}` |\n"
                      )

                  if total > 10:
                      f.write(
                          f"\n> Showing **10 of {total}** findings. "
                          "See the workflow artifact for the complete report.\n"
                      )
          PY

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && steps.docker-build.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-container-image
          recreate: true
          path: comment.md

      - name: Fail if HIGH or CRITICAL Vulnerabilities Found
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "HIGH or CRITICAL container image vulnerabilities were found."
          echo "Please review the Trivy findings."
          exit 1
