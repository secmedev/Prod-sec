name: Trivy Container Image Scan

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "40 15 * * 4"

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-test:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker images
          docker image inspect security-test:${{ github.sha }}

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb \
            generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version

      # Generate SARIF
      - name: Run Trivy SARIF scan
        id: trivy-sarif
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            security-test:${{ github.sha }}

      # Generate JSON for PR comment
      - name: Run Trivy JSON scan
        id: trivy-json
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-results.json \
            security-test:${{ github.sha }}

      - name: Verify Trivy results
        if: always()
        run: |
          echo "Checking Trivy output files..."

          if [ -f trivy-results.sarif ]; then
            echo "SARIF file created:"
            ls -lh trivy-results.sarif
          else
            echo "ERROR: SARIF file was not created."
            exit 1
          fi

          if [ -f trivy-results.json ]; then
            echo "JSON file created:"
            ls -lh trivy-results.json
          else
            echo "ERROR: JSON file was not created."
            exit 1
          fi

      # Upload SARIF to GitHub Code Scanning
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/trivy-results.sarif
          category: trivy-container-image

      # Create PR comment
      - name: Create image scan PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json

          with open("trivy-results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          findings = []

          for result in data.get("Results", []):
              target = result.get("Target", "Unknown")

              for vuln in result.get("Vulnerabilities") or []:
                  findings.append({
                      "severity": vuln.get("Severity", "UNKNOWN"),
                      "id": vuln.get("VulnerabilityID", "UNKNOWN"),
                      "package": vuln.get("PkgName", "UNKNOWN"),
                      "installed": vuln.get(
                          "InstalledVersion",
                          "UNKNOWN"
                      ),
                      "fixed": vuln.get(
                          "FixedVersion",
                          "Not available"
                      ),
                      "target": target
                  })

          with open(
              "trivy-comment.md",
              "w",
              encoding="utf-8"
          ) as out:

              out.write(
                  "## Trivy Container Image Scan\n\n"
              )

              if not findings:
                  out.write(
                      "No **HIGH or CRITICAL** vulnerabilities "
                      "were detected in the container image. "
                      ":white_check_mark:\n"
                  )

              else:
                  total = len(findings)

                  out.write(
                      f"**{total} HIGH/CRITICAL "
                      "vulnerabilities detected.** :x:\n\n"
                  )

                  out.write(
                      "| Severity | CVE | Package | "
                      "Installed | Fixed | Target |\n"
                  )

                  out.write(
                      "|---|---|---|---|---|---|\n"
                  )

                  for finding in findings[:10]:

                      severity = str(
                          finding["severity"]
                      ).replace("|", "\\|")

                      vulnerability_id = str(
                          finding["id"]
                      ).replace("|", "\\|")

                      package = str(
                          finding["package"]
                      ).replace("|", "\\|")

                      installed = str(
                          finding["installed"]
                      ).replace("|", "\\|")

                      fixed = str(
                          finding["fixed"]
                      ).replace("|", "\\|")

                      target = str(
                          finding["target"]
                      ).replace("|", "\\|")

                      out.write(
                          f"| {severity} "
                          f"| `{vulnerability_id}` "
                          f"| `{package}` "
                          f"| `{installed}` "
                          f"| `{fixed}` "
                          f"| `{target}` |\n"
                      )

                  if total > 10:
                      out.write(
                          f"\n> Showing **10 of {total}** findings. "
                          "See **Security → Code scanning** "
                          "for the complete results.\n"
                      )

          PY

      # Update the same PR comment
      - name: Post image scan results to PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-container-image
          recreate: true
          path: trivy-comment.md

      # Fail PR when HIGH/CRITICAL vulnerabilities exist
      - name: Enforce image security
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            security-test:${{ github.sha }}
