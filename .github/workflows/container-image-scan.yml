name: Security - Container Image Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-image-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Application Files
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 3 -type f -print

          echo ""
          echo "Checking app directory:"
          test -d app || {
            echo "ERROR: app directory does not exist"
            exit 1
          }

          echo ""
          echo "Checking app.py:"
          test -f app/app.py || {
            echo "ERROR: app/app.py does not exist"
            exit 1
          }

          echo ""
          echo "Application files found successfully:"
          ls -la app

      - name: Build Docker Image
        id: docker-build
        continue-on-error: true
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -t local/securitytest:${{ github.sha }} .

      - name: Create Build Failure PR Comment
        if: github.event_name == 'pull_request' && steps.docker-build.outcome == 'failure'
        shell: bash
        run: |
          cat > comment.md <<'EOF'
          ## Trivy Container Image Security Scan

          ### Result

          ❌ **Docker image build failed.**

          Trivy image scanning could not be performed because the Docker image could not be built.

          Please check the Docker build logs and fix the Dockerfile or application build.
          EOF

      - name: Comment Build Failure on PR
        if: github.event_name == 'pull_request' && steps.docker-build.outcome == 'failure'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-container-image
          recreate: true
          path: comment.md

      - name: Run Trivy Image Scan
        id: trivy
        if: steps.docker-build.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/securitytest:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: '1'

      - name: Upload Trivy Report
        if: always() && steps.docker-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-image-report
          path: trivy-results.json
          retention-days: 30

      - name: Create PR Summary
        if: always() && github.event_name == 'pull_request' && steps.docker-build.outcome == 'success'
        shell: bash
        run: |
          python3 <<'PY'
          import json

          with open("trivy-results.json") as f:
              data = json.load(f)

          findings = []

          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities", []) or []:
                  severity = vuln.get("Severity", "")

                  if severity not in ("HIGH", "CRITICAL"):
                      continue

                  findings.append({
                      "severity": severity,
                      "id": vuln.get("VulnerabilityID", ""),
                      "package": vuln.get("PkgName", ""),
                      "installed": vuln.get("InstalledVersion", ""),
                      "fixed": vuln.get("FixedVersion", "")
                  })

          severity_order = {
              "CRITICAL": 0,
              "HIGH": 1
          }

          findings.sort(
              key=lambda x: severity_order.get(x["severity"], 99)
          )

          total = len(findings)

          with open("comment.md", "w") as f:
              f.write("## Trivy Container Image Security Scan\n\n")

              if total == 0:
                  f.write(
                      "### Result\n\n"
                      "✅ No HIGH or CRITICAL vulnerabilities were found.\n"
                  )
              else:
                  f.write(
                      f"### Result\n\n"
                      f"⚠️ **{total} HIGH/CRITICAL vulnerabilities detected.**\n\n"
                  )

                  f.write(
                      "| Severity | CVE | Package | Installed | Fixed |\n"
                      "|---|---|---|---|---|\n"
                  )

                  for item in findings[:10]:
                      fixed = item["fixed"] or "Not available"

                      f.write(
                          f"| {item['severity']} | "
                          f"`{item['id']}` | "
                          f"`{item['package']}` | "
                          f"`{item['installed']}` | "
                          f"`{fixed}` |\n"
                      )

                  if total > 10:
                      f.write(
                          f"\n> Showing **10 of {total}** findings. "
                          "See the workflow artifact for the complete report.\n"
                      )
          PY

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && steps.docker-build.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-container-image
          recreate: true
          path: comment.md

      - name: Fail if Docker Build Failed
        if: steps.docker-build.outcome == 'failure'
        run: |
          echo "Docker image build failed."
          exit 1

      - name: Fail if HIGH or CRITICAL Vulnerabilities Found
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "HIGH or CRITICAL container image vulnerabilities were found."
          exit 1
