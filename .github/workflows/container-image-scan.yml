name: Trivy Container Image Scan

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "40 15 * * 4"

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-test:${{ github.sha }} \
            .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version

      - name: Run Trivy SARIF scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            security-test:${{ github.sha }}

      - name: Run Trivy JSON scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-results.json \
            security-test:${{ github.sha }}

      - name: Verify Trivy results
        if: always()
        run: |
          echo "Checking Trivy output..."

          if [ ! -f trivy-results.sarif ]; then
            echo "ERROR: trivy-results.sarif does not exist."
            exit 1
          fi

          if [ ! -f trivy-results.json ]; then
            echo "ERROR: trivy-results.json does not exist."
            exit 1
          fi

          echo "SARIF file:"
          ls -lh trivy-results.sarif

          echo "JSON file:"
          ls -lh trivy-results.json

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/trivy-results.sarif
          category: trivy-container-image

      - name: Create PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json

          findings = []

          try:
              with open(
                  "trivy-results.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

              for result in data.get("Results", []):
                  target = result.get(
                      "Target",
                      "Unknown"
                  )

                  for vuln in result.get(
                      "Vulnerabilities"
                  ) or []:

                      findings.append({
                          "severity": vuln.get(
                              "Severity",
                              "UNKNOWN"
                          ),
                          "id": vuln.get(
                              "VulnerabilityID",
                              "UNKNOWN"
                          ),
                          "package": vuln.get(
                              "PkgName",
                              "UNKNOWN"
                          ),
                          "installed": vuln.get(
                              "InstalledVersion",
                              "UNKNOWN"
                          ),
                          "fixed": vuln.get(
                              "FixedVersion",
                              "Not available"
                          ),
                          "target": target
                      })

          except Exception as e:
              print(
                  f"Could not parse Trivy results: {e}"
              )

          with open(
              "trivy-comment.md",
              "w",
              encoding="utf-8"
          ) as out:

              out.write(
                  "## Trivy Container Image Scan\n\n"
              )

              if not findings:

                  out.write(
                      "No **HIGH or CRITICAL** "
                      "vulnerabilities were detected "
                      "in the container image. "
                      ":white_check_mark:\n"
                  )

              else:

                  total = len(findings)

                  out.write(
                      f"**{total} HIGH/CRITICAL "
                      "vulnerabilities detected.** :x:\n\n"
                  )

                  out.write(
                      "| Severity | CVE | Package | "
                      "Installed | Fixed | Target |\n"
                  )

                  out.write(
                      "|---|---|---|---|---|---|\n"
                  )

                  for finding in findings[:10]:

                      out.write(
                          f"| {finding['severity']} "
                          f"| `{finding['id']}` "
                          f"| `{finding['package']}` "
                          f"| `{finding['installed']}` "
                          f"| `{finding['fixed']}` "
                          f"| `{finding['target']}` |\n"
                      )

                  if total > 10:

                      out.write(
                          f"\n> Showing **10 of "
                          f"{total}** findings. "
                          "See **Security → Code scanning** "
                          "for the complete results.\n"
                      )

          PY

          echo "Generated PR comment:"
          cat trivy-comment.md

      - name: Verify PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ ! -s trivy-comment.md ]; then
            echo "ERROR: trivy-comment.md is missing or empty."
            exit 1
          fi

          echo "PR comment file created successfully."

      - name: Post Trivy results to PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-container-image
          recreate: true
          path: trivy-comment.md

      - name: Enforce image security
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            security-test:${{ github.sha }}
