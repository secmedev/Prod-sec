name: Semgrep Security Scan

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep JSON scan
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --json \
            --output semgrep.json \
            .

      - name: Check Semgrep JSON
        if: always()
        run: |
          echo "Checking Semgrep JSON output..."

          if [ -f semgrep.json ]; then
            echo "semgrep.json created successfully"
            ls -lh semgrep.json
          else
            echo "semgrep.json was not created"
            echo '{"results":[]}' > semgrep.json
          fi

      - name: Generate Semgrep SARIF
        if: always()
        run: |
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --sarif \
            --output semgrep.sarif \
            .

      - name: Check SARIF
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            echo "semgrep.sarif created successfully"
            ls -lh semgrep.sarif
          else
            echo "ERROR: semgrep.sarif was not created"
            exit 1
          fi

      - name: Upload Semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/semgrep.sarif
          category: semgrep

      - name: Create PR Comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json
          import os

          report = "semgrep.json"

          if not os.path.exists(report):
              findings = []
          else:
              try:
                  with open(report, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  findings = data.get("results", [])

              except (json.JSONDecodeError, ValueError):
                  findings = []

          with open("comment.md", "w", encoding="utf-8") as out:

              out.write("## Semgrep Security Scan\n\n")

              if not findings:
                  out.write(
                      "No **ERROR-level security findings** detected. "
                      ":white_check_mark:\n"
                  )

              else:
                  total = len(findings)

                  out.write(
                      f"**{total} ERROR-level finding(s) detected.** "
                      ":x:\n\n"
                  )

                  out.write(
                      "| Severity | Rule | File | Line | Finding |\n"
                  )

                  out.write(
                      "|---|---|---|---:|---|\n"
                  )

                  for finding in findings[:10]:

                      extra = finding.get("extra", {})
                      metadata = extra.get("metadata", {})

                      severity = extra.get(
                          "severity",
                          "ERROR"
                      )

                      rule = finding.get(
                          "check_id",
                          "Unknown"
                      )

                      file_path = finding.get(
                          "path",
                          "N/A"
                      )

                      line = finding.get(
                          "start",
                          {}
                      ).get(
                          "line",
                          "N/A"
                      )

                      message = metadata.get(
                          "name",
                          extra.get(
                              "message",
                              "Security finding"
                          )
                      )

                      rule = str(rule).replace("|", "\\|")

                      file_path = (
                          str(file_path)
                          .replace("|", "\\|")
                          .replace("\n", " ")
                      )

                      message = (
                          str(message)
                          .replace("|", "\\|")
                          .replace("\n", " ")
                      )

                      if len(message) > 80:
                          message = message[:77] + "..."

                      out.write(
                          f"| {severity} | `{rule}` | "
                          f"`{file_path}` | {line} | "
                          f"{message} |\n"
                      )

                  if total > 10:
                      out.write(
                          f"\n> Showing **10 of {total}** findings. "
                          "See **Security → Code scanning** for the complete results.\n"
                      )

          PY

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: semgrep-security
          recreate: true
          path: comment.md

      - name: Block PR on Semgrep findings
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "Semgrep found ERROR-level security findings."
          echo "Fix the findings before merging this PR."
          exit 1
