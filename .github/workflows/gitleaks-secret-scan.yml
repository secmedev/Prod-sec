name: Security Secret Scanning

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks.json \
            --no-banner

      - name: Create PR Comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json
          import os

          report = "gitleaks.json"

          if not os.path.exists(report):
              findings = []
          else:
              try:
                  with open(report, "r", encoding="utf-8") as f:
                      findings = json.load(f)
              except (json.JSONDecodeError, ValueError):
                  findings = []

          with open("comment.md", "w", encoding="utf-8") as out:
              out.write("## Gitleaks Secret Scan\n\n")

              if not findings:
                  out.write(
                      "No secrets detected in the scanned repository. "
                      ":white_check_mark:\n"
                  )
              else:
                  out.write(
                      f"**{len(findings)} potential secret(s) detected.** "
                      ":x:\n\n"
                  )

                  out.write("### Findings\n\n")

                  out.write(
                      "| # | Rule | File | Line | Description |\n"
                  )
                  out.write(
                      "|---:|---|---|---:|---|\n"
                  )

                  for i, finding in enumerate(findings[:10], 1):
                      rule = finding.get("RuleID", "N/A")
                      file_path = finding.get("File", "N/A")
                      line = finding.get("StartLine", "N/A")
                      description = finding.get(
                          "Description",
                          "Potential secret detected"
                      )

                      rule = str(rule).replace("|", "\\|")
                      file_path = str(file_path).replace("|", "\\|")
                      description = (
                          str(description)
                          .replace("|", "\\|")
                          .replace("\n", " ")
                      )

                      out.write(
                          f"| {i} | `{rule}` | `{file_path}` | "
                          f"{line} | {description} |\n"
                      )

                  if len(findings) > 10:
                      out.write(
                          f"\n> Showing 10 of {len(findings)} findings. "
                          "Review the Gitleaks workflow for the complete results."
                      )

          PY

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gitleaks-security
          recreate: true
          path: comment.md

      - name: Block PR on secrets
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Gitleaks detected potential secrets."
          echo "Remove the detected secret before merging."
          exit 1
