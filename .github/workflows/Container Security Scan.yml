name: Trivy Container Security Scan

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '43 7 * * 6'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t security-test:${{ github.sha }} \
            .

      - name: Run Trivy SARIF scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: security-test:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0

      - name: Run Trivy JSON scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: security-test:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/trivy-results.sarif
          category: trivy-image

      - name: Create Trivy PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json

          with open("trivy-results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          findings = []

          for result in data.get("Results", []):
              target = result.get("Target", "Unknown")

              for vuln in result.get("Vulnerabilities") or []:
                  findings.append({
                      "severity": vuln.get("Severity", "UNKNOWN"),
                      "id": vuln.get("VulnerabilityID", "UNKNOWN"),
                      "package": vuln.get("PkgName", "UNKNOWN"),
                      "installed": vuln.get("InstalledVersion", "UNKNOWN"),
                      "fixed": vuln.get("FixedVersion", "Not available"),
                      "target": target
                  })

          with open("trivy-comment.md", "w", encoding="utf-8") as out:

              out.write("## Trivy Container Security Scan\n\n")

              if not findings:
                  out.write(
                      "No **HIGH or CRITICAL** vulnerabilities were detected. "
                      ":white_check_mark:\n"
                  )
              else:
                  out.write(
                      f"**{len(findings)} HIGH/CRITICAL vulnerability(s) detected.**\n\n"
                  )

                  out.write(
                      "| Severity | Vulnerability | Package | Installed | Fixed | Target |\n"
                  )
                  out.write(
                      "|---|---|---|---|---|---|\n"
                  )

                  for finding in findings[:10]:
                      out.write(
                          f"| {finding['severity']} "
                          f"| `{finding['id']}` "
                          f"| `{finding['package']}` "
                          f"| `{finding['installed']}` "
                          f"| `{finding['fixed']}` "
                          f"| `{finding['target']}` |\n"
                      )

                  if len(findings) > 10:
                      out.write(
                          f"\n> Showing **10 of {len(findings)}** findings. "
                          "See GitHub Security → Code scanning for the complete results.\n"
                      )

          PY

          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file trivy-comment.md

      - name: Fail PR when HIGH or CRITICAL vulnerabilities exist
        if: always()
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: security-test:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: false
