name: Semgrep Security Scan

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: Run Semgrep SARIF
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output "${{ github.workspace }}/semgrep.sarif" \
            .

      - name: Verify SARIF file
        run: |
          echo "Workspace:"
          pwd
          echo "Files:"
          ls -la
          echo "SARIF:"
          ls -lh "${{ github.workspace }}/semgrep.sarif"

      - name: Upload Semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/semgrep.sarif
          category: semgrep
